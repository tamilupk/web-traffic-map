<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Web Traffic Map</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--md-surface);
      padding: 20px;
    }

    .auth-card {
      background: #FFFFFF;
      border-radius: var(--md-radius-xl, 28px);
      padding: 48px 40px;
      box-shadow: var(--md-shadow-3);
      border: 1px solid var(--md-surface-dim);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .auth-card .logo {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .auth-card .subtitle {
      color: var(--md-on-surface-variant);
      margin-bottom: 32px;
      font-size: 14px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--md-radius-md, 12px);
      border: 1px solid var(--md-surface-dim);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      background: var(--md-surface-container-low, #F8F9FA);
      color: var(--md-on-surface);
      margin-bottom: 16px;
      box-sizing: border-box;
      transition: var(--md-transition-fast);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .auth-btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--md-radius-md, 12px);
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: var(--md-transition-fast);
    }

    .auth-btn-primary {
      background: var(--md-primary);
      color: white;
      box-shadow: var(--md-shadow-2);
    }

    .auth-btn-primary:hover:not(:disabled) {
      background: #4338CA;
      transform: translateY(-1px);
      box-shadow: var(--md-shadow-3);
    }

    .auth-btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      background: var(--md-error-container, #FEE2E2);
      color: var(--md-error, #DC2626);
      padding: 12px 16px;
      border-radius: var(--md-radius-sm, 8px);
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }

    .auth-invalid {
      color: var(--md-error, #DC2626);
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    .passkey-icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="logo">Create Account</h1>
      <p class="subtitle">Register a passkey for your account</p>

      <div id="form-section">
        <input type="text" class="auth-input" id="display-name"
               placeholder="Your display name" autocomplete="name" />
        <button class="auth-btn auth-btn-primary" id="register-btn">
          <svg class="passkey-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          Register Passkey
        </button>
      </div>

      <div class="auth-error" id="error-msg"></div>
      <p class="auth-invalid" id="invalid-token">
        This invite link is invalid or has expired. Please contact an administrator.
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
  <script src="/js/security.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // If already authenticated, redirect to dashboard
    if (Auth.isAuthenticated()) {
      window.location.href = '/';
    }

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('invalid-token').style.display = 'block';
    }

    document.getElementById('register-btn').addEventListener('click', async () => {
      const btn = document.getElementById('register-btn');
      const errorMsg = document.getElementById('error-msg');
      const displayName = document.getElementById('display-name').value.trim();
      errorMsg.style.display = 'none';

      if (!displayName) {
        errorMsg.textContent = 'Please enter your display name.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        // Step 1: Get registration options
        const optionsRes = await fetch('/api/auth/register/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, displayName }),
        });
        const optionsData = await optionsRes.json();
        if (!optionsData.success) throw new Error(optionsData.error);

        // Step 2: Create credential in browser
        const credential = await SimpleWebAuthnBrowser.startRegistration({
          optionsJSON: optionsData.options,
        });

        // Step 3: Send to server for verification
        const verifyRes = await fetch('/api/auth/register/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            credential,
            challenge: optionsData.options.challenge,
          }),
        });
        const verifyData = await verifyRes.json();
        if (!verifyData.success) throw new Error(verifyData.error);

        // Step 4: Store JWT and redirect
        Auth.setSession(verifyData.token, verifyData.user);
        window.location.href = '/';
      } catch (error) {
        console.error('Registration failed:', error);
        errorMsg.textContent = error.name === 'NotAllowedError'
          ? 'Passkey registration was cancelled.'
          : (error.message || 'Registration failed.');
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="passkey-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          Register Passkey`;
      }
    });
  </script>
</body>
</html>
