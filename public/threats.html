<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threat Analyzer - Traffic Map</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <style>
    .threat-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      overflow-y: auto;
    }

    .threat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 48px;
    }

    .threat-timeline {
      position: relative;
      padding-left: 32px;
    }

    .threat-timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--md-surface-dim);
    }

    .threat-card {
      background: #FFFFFF;
      border-radius: var(--md-radius-lg);
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: var(--md-shadow-2);
      border: 1px solid var(--md-surface-dim);
      position: relative;
      transition: var(--md-transition-normal);
    }

    .threat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--md-shadow-3);
    }

    .threat-card::before {
      content: '';
      position: absolute;
      left: -37px;
      top: 24px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--md-primary);
      z-index: 1;
    }

    .threat-card.level-critical::before { border-color: var(--md-error); }
    .threat-card.level-high::before { border-color: #F59E0B; }
    .threat-card.level-medium::before { border-color: #3B82F6; }

    .threat-time {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .threat-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .threat-ip {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-on-surface);
    }

    .threat-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-critical { background: var(--md-error-container); color: var(--md-error); }
    .badge-high { background: #FEF3C7; color: #92400E; }
    .badge-medium { background: #DBEAFE; color: #1E40AF; }
    .badge-low { background: var(--md-surface-container); color: var(--md-on-surface-variant); }

    .threat-summary {
      font-size: 15px;
      color: var(--md-on-surface);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .threat-findings {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .finding-chip {
      background: var(--md-surface-container-low);
      padding: 6px 12px;
      border-radius: var(--md-radius-sm);
      font-size: 12px;
      color: var(--md-on-surface-variant);
      border: 1px solid var(--md-surface-dim);
    }

    .threat-footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--md-surface-dim);
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--md-on-surface-variant);
    }

    .footer-item { display: flex; align-items: center; gap: 6px; }

    .btn-hero {
      background: var(--md-primary);
      color: white;
      padding: 12px 24px;
      border-radius: var(--md-radius-md);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--md-shadow-2);
    }

    .btn-hero:hover {
      background: #4338CA;
      transform: scale(1.02);
    }

    .empty-state {
      text-align: center;
      padding: 100px 0;
      color: var(--md-on-surface-variant);
    }

    .back-nav {
      margin-bottom: 24px;
    }

    .back-link {
      color: var(--md-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="threat-layout">
    <nav class="back-nav">
      <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Dashboard
      </a>
    </nav>

    <header class="threat-header">
      <div>
        <h1 class="logo" style="font-size: 36px;">Threat Timeline</h1>
        <p class="subtitle">AI-driven analysis of suspicious traffic patterns</p>
      </div>
      <button class="btn btn-hero" id="rescan-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        Full Rescan
      </button>
    </header>

    <div id="timeline-container" class="threat-timeline">
      <!-- Cards will be injected here -->
      <div class="empty-state">
        <p>Scanning logs for threats...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadThreats() {
      const container = document.getElementById('timeline-container');
      try {
        const response = await fetch('/api/threats');
        const result = await response.json();
        
        if (result.success && result.data.length > 0) {
          container.innerHTML = '';
          result.data.forEach(incident => {
            const findings = JSON.parse(incident.details || '[]');
            const date = new Date(incident.incident_unix * 1000).toLocaleString();
            
            const card = document.createElement('div');
            card.className = `threat-card level-${incident.threat_level}`;
            card.innerHTML = `
              <div class="threat-time">${date}</div>
              <div class="threat-title-row">
                <div class="threat-ip">${incident.ip}</div>
                <span class="threat-badge badge-${incident.threat_level}">${incident.threat_level}</span>
              </div>
              <div class="threat-summary">${incident.summary}</div>
              <div class="threat-findings">
                ${findings.map(f => `<span class="finding-chip">${f}</span>`).join('')}
              </div>
              <div class="threat-footer">
                <div class="footer-item">
                  <strong>ISP:</strong> ${incident.isp || 'Unknown'}
                </div>
                <div class="footer-item">
                  <strong>Location:</strong> ${incident.country_flag || ''} ${incident.country || 'Unknown'}
                </div>
                <div class="footer-item">
                  <strong>Requests:</strong> ${incident.request_count}
                </div>
                <div class="footer-item">
                  <strong>Risk:</strong> ${incident.risk_score}/100
                </div>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<div class="empty-state"><p>No threats identified yet. Keep monitoring!</p></div>';
        }
      } catch (error) {
        console.error('Failed to load threats:', error);
        container.innerHTML = '<div class="empty-state"><p>Error loading threat timeline.</p></div>';
      }
    }

    document.getElementById('rescan-btn').addEventListener('click', async () => {
      if (!confirm('This will clear history and restart scanning from the beginning. Continue?')) return;
      
      const btn = document.getElementById('rescan-btn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';
      
      try {
        await fetch('/api/threats/rescan', { method: 'POST' });
        alert('Scan reset! The backend worker will now begin re-analyzing all logs.');
        window.location.reload();
      } catch (e) {
        alert('Failed to trigger rescan.');
        btn.disabled = false;
        btn.textContent = 'Full Rescan';
      }
    });

    // Initial load
    loadThreats();
    // Poll every 30s
    setInterval(loadThreats, 30000);
  </script>
</body>
</html>
