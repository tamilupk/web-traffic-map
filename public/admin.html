<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Traffic Map</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .admin-layout {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .admin-header {
      margin-bottom: 40px;
    }

    .admin-card {
      background: #FFFFFF;
      border-radius: var(--md-radius-lg);
      padding: 32px;
      box-shadow: var(--md-shadow-2);
      border: 1px solid var(--md-surface-dim);
      margin-bottom: 24px;
    }

    .admin-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--md-on-surface);
      margin-bottom: 8px;
    }

    .admin-card p {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      margin-bottom: 20px;
    }

    .invite-form {
      display: flex;
      gap: 10px;
    }

    .invite-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--md-radius-md, 12px);
      border: 1px solid var(--md-surface-dim);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--md-surface-container-low, #F8F9FA);
      color: var(--md-on-surface);
      transition: var(--md-transition-fast);
    }

    .invite-input:focus {
      outline: none;
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .invite-btn {
      padding: 12px 24px;
      border-radius: var(--md-radius-md, 12px);
      background: var(--md-primary);
      color: white;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--md-transition-fast);
    }

    .invite-btn:hover:not(:disabled) {
      background: #4338CA;
    }

    .invite-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .invite-history {
      margin-top: 24px;
    }

    .invite-item {
      background: var(--md-surface-container-low);
      border-radius: var(--md-radius-md);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--md-surface-dim);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .invite-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .invite-email {
      font-weight: 600;
      font-size: 14px;
      color: var(--md-on-surface);
    }

    .invite-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: #DCFCE7;
      color: #166534;
    }

    .invite-url {
      font-size: 12px;
      color: var(--md-primary);
      word-break: break-all;
      display: block;
      margin-bottom: 8px;
    }

    .invite-meta {
      font-size: 11px;
      color: var(--md-on-surface-variant);
    }

    .copy-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--md-surface-dim);
      background: white;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: var(--md-transition-fast);
    }

    .copy-btn:hover {
      border-color: var(--md-primary);
      color: var(--md-primary);
    }

    .back-nav {
      margin-bottom: 24px;
    }

    .back-link {
      color: var(--md-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--md-on-surface-variant);
      font-size: 14px;
    }

    .error-msg {
      background: var(--md-error-container, #FEE2E2);
      color: var(--md-error, #DC2626);
      padding: 10px 14px;
      border-radius: var(--md-radius-sm, 8px);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <nav class="back-nav">
      <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Dashboard
      </a>
    </nav>

    <header class="admin-header">
      <h1 class="logo" style="font-size: 32px;">Admin Panel</h1>
      <p class="subtitle">Manage user access</p>
    </header>

    <div class="admin-card">
      <h2>Invite User</h2>
      <p>Send an invite link to grant dashboard access. Links expire in 24 hours.</p>
      <div class="invite-form">
        <input type="email" class="invite-input" id="invite-email" placeholder="user@example.com" />
        <button class="invite-btn" id="invite-btn">Invite</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="admin-card">
      <h2>Recent Invites</h2>
      <div id="invite-history">
        <div class="empty-state">Invites you create will appear here.</div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Require admin
    if (!Auth.isAuthenticated()) {
      window.location.href = '/login';
    } else {
      const user = Auth.getUser();
      if (!user || !user.is_admin) {
        window.location.href = '/';
      }
    }

    const invites = [];

    document.getElementById('invite-btn').addEventListener('click', async () => {
      const btn = document.getElementById('invite-btn');
      const input = document.getElementById('invite-email');
      const errorMsg = document.getElementById('error-msg');
      const email = input.value.trim();
      errorMsg.style.display = 'none';

      if (!email || !email.includes('@')) {
        errorMsg.textContent = 'Enter a valid email address.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await Auth.fetch('/api/admin/invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error);

        invites.unshift(data.invite);
        renderInvites();
        input.value = '';
      } catch (err) {
        errorMsg.textContent = err.message || 'Failed to create invite.';
        errorMsg.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Invite';
    });

    // Enter key to submit
    document.getElementById('invite-email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('invite-btn').click();
    });

    function renderInvites() {
      const container = document.getElementById('invite-history');

      if (invites.length === 0) {
        container.innerHTML = '<div class="empty-state">Invites you create will appear here.</div>';
        return;
      }

      container.innerHTML = invites.map((inv, i) => `
        <div class="invite-item">
          <div class="invite-item-header">
            <span class="invite-email">${inv.email}</span>
            <span class="invite-badge">${inv.existing_user ? 'Additional Passkey' : 'New User'}</span>
          </div>
          <a href="${inv.registration_url}" target="_blank" class="invite-url">${inv.registration_url}</a>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="invite-meta">Expires: ${new Date(inv.expires_at).toLocaleString()}</span>
            <button class="copy-btn" onclick="copyUrl(${i})">Copy Link</button>
          </div>
        </div>
      `).join('');
    }

    function copyUrl(index) {
      const url = invites[index].registration_url;
      navigator.clipboard.writeText(url).then(() => {
        const btns = document.querySelectorAll('.copy-btn');
        btns[index].textContent = 'Copied!';
        setTimeout(() => { btns[index].textContent = 'Copy Link'; }, 2000);
      });
    }
  </script>
</body>
</html>
