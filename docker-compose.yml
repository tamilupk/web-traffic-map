version: '3.8'

services:
  web-traffic-map:
    image: tamilupk/web-traffic-map:latest
    container_name: web-traffic-map
    restart: unless-stopped
    ports:
      - "30045:30045"
    volumes:
      # Mount nginx logs directory (read-only)
      - ./nginx-logs:/logs:ro
      # Persist database
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=30045
      - DB_PATH=/data/traffic.db
      - LOG_DIR=/logs
      - RP_ID=traffic.example.com
      - RP_NAME=Web Traffic Map
      - WEBAUTHN_ORIGIN=https://traffic.example.com
      # - JWT_SECRET=your-secret-here  # Optional, auto-generated if not set
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30045/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
