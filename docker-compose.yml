services:
  web-traffic-map:
    image: tamilupk/web-traffic-map:latest
    container_name: web-traffic-map
    restart: unless-stopped
    ports:
      - "30045:30045"
    volumes:
      # Mount nginx logs directory (read-only)
      - ./nginx-logs:/logs:ro
      # Persist database
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=30045
      - DB_PATH=/data/traffic.db
      - LOG_DIR=/logs
      - RP_ID=${RP_ID:-localhost}
      - RP_NAME=${RP_NAME:-Web Traffic Map}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:30045}
      - CARTO_BASEMAP_API_KEY=${CARTO_BASEMAP_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-} # Optional, auto-generated if not set
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - OPEN_AI_API_URL=${OPEN_AI_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY:-}
      - OPEN_AI_API_MODEL=${OPEN_AI_API_MODEL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30045/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
